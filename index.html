      { title:"GPT-5.4 Pro", tag:"Pro Plan Only", color:GOLD,

      { title:"What's Retired", tag:"Gone from Consumer App", color:RED,

    headline:"Stop searching. Start directing.",
    subline:"The gap between a mediocre answer and a great one is almost always how you asked.",
    cards:[
      { title:"Give It a Role", tag:"Instant upgrade", color:PURPLE,
        desc:"Open with who it should be. 'Act as a senior marketing strategist...' This shapes every response that follows and lifts quality immediately.",
        tip:"Example: 'You are an experienced AI strategy consultant who specialises in helping SMEs adopt AI tools practically. My client runs a 12-person accountancy firm.'" },
      { title:"Add Your Actual Context", tag:"Critical", color:GREEN,
        desc:"Generic questions get generic answers. Give it your real situation — your constraints, your goals, your audience, your existing resources.",
        tip:"Bad: 'Write me a proposal.' Better: 'Write a 1-page consulting proposal for a 3-day AI readiness workshop for a 50-person logistics company. Include objectives, deliverables, and a day-by-day outline.'" },
      { title:"Specify the Output Format", tag:"Saves time", color:GOLD,
        desc:"Tell it exactly what you want back — a table, bullet list, 3-paragraph email, 10-slide outline. Without this it guesses — and usually guesses wrong.",
        tip:"End your prompt with: '...give me this as a table' or '...as a draft email I can send directly' or '...as a numbered action plan with one sentence per step.'" },
      { title:"Iterate, Don't Restart", tag:"Power move", color:ACCENT,
        desc:"Most people throw away a bad answer and rephrase. Instead: reply to it. 'Make it shorter.' 'Less formal.' 'The third point is wrong — remove it.'",
        tip:"Think of it like working with a person. You wouldn't send a new brief every time — you'd just say 'actually, change this bit.'" },
      { title:"The Critique Trick", tag:"Quality check", color:RED,
        desc:"After it produces something, ask: 'What are the weaknesses in this?' or 'What would a sceptical client say?' It'll honestly critique its own work.",
        tip:"Use before sending important proposals or pitches. It's like a free second opinion from someone who isn't protecting your ego." },
      { title:"Custom Instructions", tag:"Set once, always on", color:PINK,
        desc:"In Settings → Personalisation → Custom Instructions, tell ChatGPT who you are and how you want it to respond — permanently. Every future conversation starts smarter.",
        tip:"Include: profession, goals, preferred tone. E.g. 'I'm an AI consultant, 50, rebuilding my career. Direct responses, no padding, UK English.'" },
    ]
  },

    subline:"By default, each new chat starts blank. These are the tools that fix that.",
    cards:[
      { title:"Persistent Memory", tag:"Plus / Pro — On by Default", color:GREEN,
        desc:"ChatGPT saves facts about you across conversations — your name, job, preferences, projects. The longer you use it, the more personalised responses become.",

      { title:"Projects", tag:"Plus / Pro", color:PURPLE,
        desc:"Persistent workspaces where context carries across all chats. Set standing instructions, upload files. Deep Research, Voice, and Memory all work inside Projects.",

      { title:"Project File Context", tag:"Upgraded 2026", color:GOLD,
        desc:"Upload documents to a Project and ChatGPT references them across every conversation — your CV, service offerings, client brief — without re-uploading each time.",

      { title:"Memory vs History", tag:"Important distinction", color:ACCENT,
        desc:"Memory (facts it saves about you) and Chat History (record of past conversations) are different. Memory is active context. History is a searchable archive.",

      { title:"Temporary Chats", tag:"Privacy option", color:RED,

      { title:"MCP (Model Context Protocol)", tag:"Advanced", color:PURPLE,
        desc:"The standard that lets ChatGPT connect to virtually any tool — databases, internal systems, custom apps. Deep Research can restrict searches to your own trusted data sources.",

const PROMPT_TEMPLATE = `Before building anything, use your web search tool to find the most current information on [TOPIC] — including latest versions, recent updates, and any new features released in the last 6 months. Then create an interactive React Artifact that [WHAT_IT_DOES] for [AUDIENCE]. Structure it with tabs so it's not overwhelming. Focus on practical use, not definitions. Every section should answer "what can I actually do with this today?" not "what is this?" Make it feel like a coaching resource, not a textbook.`;

const EXAMPLES = [
  { topic:"Notion AI", does:"explains all current AI features, automations, and integrations", audience:"freelancers and small business owners who already use Notion but haven't touched the AI features" },
  { topic:"LinkedIn for professionals", does:"coaches on profile optimisation, content strategy, and outreach using AI tools", audience:"career changers and consultants building a new professional presence" },
  { topic:"Microsoft Copilot in Office 365", does:"walks through practical use cases in Word, Excel, Outlook, and Teams", audience:"non-technical business users who want to use AI in their existing tools" },
  { topic:"Midjourney and AI image generation", does:"covers prompting, styles, workflows, and commercial use", audience:"marketers and content creators with no design background" },
  { topic:"Claude AI (Anthropic)", does:"explains features, models, Projects, and how it differs from ChatGPT", audience:"professionals who use ChatGPT and want to understand when Claude is better" },
];

function LauncherTab() {
  const [topic, setTopic]     = useState("");
  const [does, setDoes]       = useState("");
  const [audience, setAudience] = useState("");
  const [copied, setCopied]   = useState(false);
  const [exIdx, setExIdx]     = useState(null);

  const filled = topic.trim() && does.trim() && audience.trim();
  const builtPrompt = PROMPT_TEMPLATE
    .replace("[TOPIC]", topic.trim() || "[TOPIC]")
    .replace("[WHAT_IT_DOES]", does.trim() || "[WHAT IT DOES]")
    .replace("[AUDIENCE]", audience.trim() || "[WHO THE AUDIENCE IS]");

  function loadEx(i) { setTopic(EXAMPLES[i].topic); setDoes(EXAMPLES[i].does); setAudience(EXAMPLES[i].audience); setExIdx(i); setCopied(false); }
  function copy() { navigator.clipboard.writeText(builtPrompt).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2500); }); }

  const inp = { width:"100%", background:"#0c1420", border:"1px solid #1e2d42", borderRadius:8, color:"#dde3ed", fontSize:13, padding:"10px 12px", fontFamily:"inherit", lineHeight:1.5, resize:"vertical", boxSizing:"border-box" };
  const lbl = { fontSize:11, color:ACCENT, letterSpacing:"1.5px", textTransform:"uppercase", fontWeight:600, marginBottom:6, display:"block", fontFamily:"monospace" };

  return (
    <div>
      <h2 style={{fontSize:"clamp(16px,3.5vw,22px)",fontWeight:600,margin:"0 0 6px",color:"#e8edf5"}}>Build a coaching tool for any AI topic</h2>
      <p style={{fontSize:13,color:"#5a7090",margin:"0 0 20px",lineHeight:1.6}}>This prompt tells Claude to search for current information first, then build an up-to-date interactive coaching tool — just like this one. Fill in the three fields, copy the prompt, and paste it into a new Claude conversation.</p>

      <div style={{background:"#0c1420",border:"1px solid #1e2d42",borderLeft:`3px solid ${PURPLE}`,borderRadius:8,padding:"14px 16px",marginBottom:24,display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12}}>
        {[{l:"Step 1",t:"Fill in the 3 fields below",c:ACCENT},{l:"Step 2",t:"Copy the generated prompt",c:PURPLE},{l:"Step 3",t:"Paste into a new Claude chat",c:GREEN}].map(s=>(
          <div key={s.l} style={{display:"flex",gap:10,alignItems:"flex-start"}}>
            <span style={{background:s.c+"22",color:s.c,borderRadius:4,fontSize:10,fontWeight:700,padding:"2px 7px",letterSpacing:1,flexShrink:0}}>{s.l}</span>
            <span style={{fontSize:12,color:"#8aaac8",lineHeight:1.5}}>{s.t}</span>
          </div>
        ))}
      </div>

      <div style={{marginBottom:20}}>
        <span style={lbl}>Load an example</span>
        <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {EXAMPLES.map((ex,i)=>(
            <button key={i} onClick={()=>loadEx(i)} style={{background:exIdx===i?ACCENT+"22":"#0c1420",border:`1px solid ${exIdx===i?ACCENT+"60":"#1e2d42"}`,color:exIdx===i?ACCENT:"#5a7090",borderRadius:6,padding:"5px 12px",fontSize:12,cursor:"pointer"}}>{ex.topic}</button>
          ))}
        </div>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:16,marginBottom:24}}>
        <div><label style={lbl}>① Topic — what Claude should research first</label><textarea rows={2} placeholder="e.g. Notion AI, Microsoft Copilot, Midjourney..." value={topic} onChange={e=>{setTopic(e.target.value);setExIdx(null);}} style={inp}/></div>
        <div><label style={lbl}>② What it does — the purpose of the tool</label><textarea rows={2} placeholder="e.g. explains all current features and integrations..." value={does} onChange={e=>{setDoes(e.target.value);setExIdx(null);}} style={inp}/></div>
        <div><label style={lbl}>③ Audience — who it's built for</label><textarea rows={2} placeholder="e.g. non-technical business owners, freelancers..." value={audience} onChange={e=>{setAudience(e.target.value);setExIdx(null);}} style={inp}/></div>
      </div>

      <div style={{marginBottom:16}}>
        <span style={lbl}>Your generated prompt</span>
        <div style={{background:"#080c14",border:`1px solid ${filled?ACCENT+"40":"#1e2d42"}`,borderRadius:8,padding:"14px 16px",fontSize:12.5,color:filled?"#c8d8e8":"#3a5060",lineHeight:1.8,fontFamily:"monospace",whiteSpace:"pre-wrap",wordBreak:"break-word",minHeight:100}}>{builtPrompt}</div>
      </div>

      <button onClick={copy} disabled={!filled} style={{background:filled?(copied?GREEN+"22":`linear-gradient(135deg,${ACCENT}33,${PURPLE}33)`):"#0c1420",border:`1px solid ${filled?(copied?GREEN:ACCENT+"60"):"#1e2d42"}`,color:filled?(copied?GREEN:ACCENT):"#3a5060",borderRadius:8,padding:"11px 24px",fontSize:13,fontWeight:600,cursor:filled?"pointer":"not-allowed",display:"flex",alignItems:"center",gap:8}}>
        <span>{copied?"✓":"⎘"}</span>{copied?"Copied — paste into Claude":filled?"Copy prompt to clipboard":"Fill in all three fields to generate"}
      </button>

      <div style={{marginTop:24,padding:"12px 16px",background:"#0a0f1a",border:"1px solid #1a2535",borderRadius:8,fontSize:12,color:"#445566",lineHeight:1.6}}>
        <strong style={{color:"#5a7090"}}>Why this works:</strong> The prompt forces Claude to search for current information before building — so the output is based on what's true today, not training data that might be months out of date.
      </div>
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState("models");
  const [expanded, setExpanded]   = useState(null);
  const section    = sections[activeTab];
  const isLauncher = activeTab === "launcher";

  return (
    <div style={{minHeight:"100vh",background:"#080c14",color:"#dde3ed"}}>
      <div style={{background:"linear-gradient(160deg,#0d1220 0%,#111827 60%,#0d1220 100%)",borderBottom:"1px solid #1e2d42",padding:"28px 20px 20px"}}>
        <div style={{maxWidth:880,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}>
            <span style={{background:"linear-gradient(90deg,#22d3ee,#a78bfa)",borderRadius:6,padding:"3px 12px",fontSize:10,letterSpacing:"2.5px",textTransform:"uppercase",color:"#080c14",fontWeight:700}}>Updated June 2026</span>
            <span style={{fontSize:11,color:"#4a6080",fontFamily:"monospace"}}>GPT-5.5 · Agent Mode · Deep Research</span>
          </div>
          <h1 style={{fontSize:"clamp(20px,5vw,34px)",fontWeight:300,margin:"0 0 6px",color:"#f0f4fa",letterSpacing:"-0.5px",lineHeight:1.2}}>
            ChatGPT in 2026:<br/>
            <span style={{fontWeight:700,background:"linear-gradient(90deg,#22d3ee,#a78bfa)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Your Coaching Guide</span>
          </h1>
          <p style={{fontSize:13,color:"#5a7090",margin:0,fontStyle:"italic"}}>Beyond the basics — the tools, models, and moves that actually change what's possible.</p>
        </div>
      </div>

      <div style={{background:"#0a0f1a",borderBottom:"1px solid #1a2535",overflowX:"auto"}}>
        <div style={{display:"flex",padding:"0 16px",gap:2,maxWidth:880,margin:"0 auto",minWidth:"fit-content"}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>{setActiveTab(t.id);setExpanded(null);}} style={{background:"none",border:"none",borderBottom:activeTab===t.id?`2px solid ${t.id==="launcher"?GOLD:ACCENT}`:"2px solid transparent",color:activeTab===t.id?(t.id==="launcher"?GOLD:"#f0f4fa"):"#445566",padding:"12px 14px",cursor:"pointer",fontSize:12,fontWeight:activeTab===t.id?600:400,whiteSpace:"nowrap",flexShrink:0}}>{t.label}</button>
          ))}
        </div>
      </div>

      <div style={{padding:"24px 16px 48px",maxWidth:880,margin:"0 auto"}}>
        {isLauncher ? <LauncherTab/> : (
          <>
            <div style={{marginBottom:20}}>
              <h2 style={{fontSize:"clamp(16px,3.5vw,22px)",fontWeight:600,margin:"0 0 6px",color:"#e8edf5",lineHeight:1.3}}>{section.headline}</h2>
              <p style={{fontSize:13,color:"#5a7090",margin:"0 0 12px",lineHeight:1.5}}>{section.subline}</p>
              {section.alert&&<div style={{background:"#1a1208",border:"1px solid #5a3800",borderLeft:`3px solid ${GOLD}`,borderRadius:8,padding:"10px 14px",fontSize:12,color:"#c49040",lineHeight:1.5}}>{section.alert}</div>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(255px,1fr))",gap:14}}>
              {section.cards.map((card,i)=>{
                const open=expanded===i;
                return (
                  <div key={i} onClick={()=>setExpanded(open?null:i)} style={{background:open?"#0f1828":"#0c1420",border:`1px solid ${open?card.color+"50":"#1a2535"}`,borderTop:`3px solid ${card.color+(open?"ff":"55")}`,borderRadius:10,padding:"16px 16px 14px",cursor:"pointer"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                      <span style={{background:card.color+"18",color:card.color,fontSize:9,padding:"2px 8px",borderRadius:4,fontWeight:600,letterSpacing:"0.8px",textTransform:"uppercase"}}>{card.tag}</span>
                      <span style={{color:open?card.color:"#2a3d55",fontSize:20,lineHeight:1,transform:open?"rotate(45deg)":"none",fontWeight:200}}>+</span>
                    </div>
                    <h3 style={{fontSize:15,fontWeight:600,margin:"0 0 8px",color:"#eef2f8",lineHeight:1.3}}>{card.title}</h3>
                    <p style={{fontSize:12.5,color:"#5a7090",margin:0,lineHeight:1.65}}>{card.desc}</p>
                    {open&&<div style={{marginTop:14,paddingTop:12,borderTop:`1px solid ${card.color}25`,display:"flex",gap:8,alignItems:"flex-start"}}>
                      <span style={{fontSize:14,flexShrink:0,marginTop:1}}>💡</span>
                      <p style={{fontSize:12,color:"#8aaac8",margin:0,lineHeight:1.65,fontStyle:"italic"}}>{card.tip}</p>
                    </div>}
                  </div>
                );
              })}
            </div>
            <p style={{textAlign:"center",fontSize:10,color:"#1e2d42",marginTop:20,letterSpacing:"1.5px",textTransform:"uppercase",fontFamily:"monospace"}}>Tap any card to reveal the practical tip</p>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
